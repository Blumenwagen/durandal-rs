[package]
name = "durandal-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust rewrite of Durandal, a Linux TUI system monitor and agent-readable ops snapshotter"
license = "MIT"
repository = "https://github.com/Blumenwagen/durandal-rs"
homepage = "https://github.com/Blumenwagen/durandal-rs"
readme = "README.md"
keywords = ["tui", "system-monitor", "linux", "observability", "docker"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "durandal_rs"
path = "src/lib.rs"

[[bin]]
name = "durandal-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
whoami = "1.6"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
pretty_assertions = "1.4"
tempfile = "3.14"
